<!DOCTYPE html>

<html lang="en" data-bs-theme="light"> <!-- from bootstrap for lifht/dark theme-->
    <head>
        <meta charset="UTF-8"> <!-- i saw this code everwhere and it turns out to be a crucial metadata-->
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- i got this code from the documentations of W3schools-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <link href="../static/styles.css" rel="stylesheet">

        <title> {% block title %} {% endblock %} </title>
    </head>

    <body class="bg-polka-dots min-vh-100">
        <nav class="navbar navbar-expand-lg navbar-dark px-4 mb-4">
            <div class="container-fluid">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="navbar-nav ms-auto">
                    <a class="nav-link active" href="/index">Home</a>

                    {% if session["user_id"] %}
                        {% if session["is_admin"] %}
                        <a class="nav-link text-warning" href="/admin">Admin Panel</a>
                        {% endif %}

                        <a class="nav-link" href="/cart">Cart</a>
                        <a class="nav-link" href="/logout">Logout</a>
                    {% else %}
                        <a class="nav-link" href="/login">Login</a>
                    {% endif %}
                </div>
            </div>
        </nav>
        {% if get_flashed_messages() %}
            <header>
                <div class="alert alert-primary mb-0 text-center" role="alert">
                    {{ get_flashed_messages() | join(" ") }}
                </div>
            </header>
        {% endif %}

        <main class="container" style="max-width: 800px;">
                {% block main %}{% endblock %}
        </main>
    </body>
</html>
